name: Publish approved portfolio v1.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-approved.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved project files
        run: |
          base64 -d .github/portfolio-update.patch.gz.b64 | gzip -d > /tmp/portfolio.patch
          git apply --exclude=.github/workflows/pages.yml --check /tmp/portfolio.patch
          git apply --exclude=.github/workflows/pages.yml /tmp/portfolio.patch
          node --check js/site.js
          git rm .github/portfolio-update.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js imgs docs
          git commit -m "Publish custom SVG project cards, covers and circular actions"
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v1.0.0
          git push origin v1.0.0
          git archive --format=zip --prefix=Meu-Portfolio/ --output=/tmp/Meu-Portfolio-v1.0.0.zip HEAD
          gh release create v1.0.0 /tmp/Meu-Portfolio-v1.0.0.zip --title "v1.0.0 — Cards SVG personalizados" --notes-file docs/release-v1.0.0.md
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js imgs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
